services:
  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    networks:
      - npm_network

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - npm_network
      - internal

  worker:
    build:
      context: ./backend
      target: runtime
    command: ['node', 'dist/worker']
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  mongo:
    image: mongo:7
    hostname: mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  mongo_data:
  redis_data:

networks:
  npm_network:
    external: true
  internal:
